name: Build Android APK

# Builds + signs the native wrapper APK in the cloud so nobody has to open
# Android Studio. Trigger from Actions tab → "Build Android APK" → "Run
# workflow", or push a tag like v1.2.3. Signs with the release keystore
# (repo secrets) and publishes the APK into the app so operators can install
# it from /mobile/install.html.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

# Only these paths should ever need editing.
env:
  APP_ROOT:         spice-config-complete
  PWA_SOURCE:       spice-config-complete/public-mobile
  APK_PUBLISH_DIR:  spice-config-complete/public-mobile/downloads
  APK_PUBLISH_NAME: spice-auction.apk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # ── Capacitor deps ────────────────────────────────────────────────
      - name: Install Capacitor deps
        working-directory: ${{ env.APP_ROOT }}/mobile-native
        run: npm install

      # ── Copy the PWA into the Capacitor webDir ────────────────────────
      # capacitor.config.json has webDir: "www"; workflow populates it.
      # Adds index.html shim if the PWA entry file is app.html — Capacitor
      # requires index.html at webDir root or the wrapper shows a blank page.
      - name: Copy PWA into www/
        run: |
          rm -rf ${{ env.APP_ROOT }}/mobile-native/www
          mkdir -p ${{ env.APP_ROOT }}/mobile-native/www
          cp -R ${{ env.PWA_SOURCE }}/. ${{ env.APP_ROOT }}/mobile-native/www/
          if [ ! -f ${{ env.APP_ROOT }}/mobile-native/www/index.html ] \
             && [ -f ${{ env.APP_ROOT }}/mobile-native/www/app.html ]; then
            cp ${{ env.APP_ROOT }}/mobile-native/www/app.html \
               ${{ env.APP_ROOT }}/mobile-native/www/index.html
            echo "Created index.html shim from app.html"
          fi
          echo "PWA files in www/:"
          ls ${{ env.APP_ROOT }}/mobile-native/www | head -20

      # ── Generate native Android project (idempotent) ──────────────────
      - name: Add Android platform + sync web assets
        working-directory: ${{ env.APP_ROOT }}/mobile-native
        run: |
          [ -d android ] || npx cap add android
          rm -f android/local.properties        # drop any local Mac SDK path
          npx cap sync android

      # ── Bluetooth permissions for thermal printers (Android 12+) ─────
      - name: Add Bluetooth permissions
        working-directory: ${{ env.APP_ROOT }}/mobile-native/android/app/src/main
        run: |
          if ! grep -q BLUETOOTH_CONNECT AndroidManifest.xml; then
            sed -i 's#<application#<uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />\n    <application#' AndroidManifest.xml
          fi

      # ── Signing (writes keystore + config from repo secrets) ─────────
      - name: Configure signing
        working-directory: ${{ env.APP_ROOT }}/mobile-native/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PW:  ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS:    ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW:       ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > spice-release.keystore
          cat > keystore.properties <<EOF
          storeFile=../spice-release.keystore
          storePassword=$KEYSTORE_PW
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PW
          EOF
          grep -q 'signing.gradle' app/build.gradle || \
            printf '\napply from: "../../signing/signing.gradle"\n' >> app/build.gradle

      # ── Build ─────────────────────────────────────────────────────────
      - name: Build signed release APK
        working-directory: ${{ env.APP_ROOT }}/mobile-native/android
        run: ./gradlew assembleRelease --stacktrace

      # Always upload so we can grab the APK even if the git-commit step
      # at the end fails (protected branch, no write permission, etc.).
      - name: Upload APK as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spice-auction-apk
          path: ${{ env.APP_ROOT }}/mobile-native/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn

      # ── Publish APK into repo (served at /mobile/install.html) ───────
      - name: Publish APK into repo
        run: |
          mkdir -p "${{ env.APK_PUBLISH_DIR }}"
          cp ${{ env.APP_ROOT }}/mobile-native/android/app/build/outputs/apk/release/app-release.apk \
             "${{ env.APK_PUBLISH_DIR }}/${{ env.APK_PUBLISH_NAME }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ env.APK_PUBLISH_DIR }}/${{ env.APK_PUBLISH_NAME }}"
          git commit -m "chore: publish Android APK [skip ci]" || echo "No change to commit"
          git push